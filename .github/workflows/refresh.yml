name: Daily WTI price + publish

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  wti-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: API keys (.env, not committed)
        run: |
          echo "EIA_API_KEY=${{ secrets.EIA_API_KEY }}" >> .env
          echo "FRED_API_KEY=${{ secrets.FRED_API_KEY }}" >> .env

      - name: Refresh all source data after a code change
        if: github.event_name == 'push'
        run: python fetch_data.py

      - name: Validate refreshed source data
        if: github.event_name == 'push'
        run: python validate_data.py

      - name: Refresh WTI price, then rebuild the page
        run: |
          python update_wti.py
          python bundle.py

      - name: Save the refreshed price back to the repo
        run: |
          git config user.name  "MI3 Dashboard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily WTI price refresh (auto)"
            git push
          fi

      - name: Package the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish-online

      - name: Publish to the live link
        id: deploy
        uses: actions/deploy-pages@v4
