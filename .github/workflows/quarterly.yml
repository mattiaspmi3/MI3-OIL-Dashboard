name: Monthly data refresh + quarterly review reminder

on:
  schedule:
    - cron: "0 8 1 * *"   # 08:00 UTC on the 1st of EVERY month
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  full-refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Put the API keys where the scripts expect them (.env, not committed)
        run: |
          echo "EIA_API_KEY=${{ secrets.EIA_API_KEY }}" >> .env
          echo "FRED_API_KEY=${{ secrets.FRED_API_KEY }}" >> .env

      - name: Re-pull ALL EIA/BLS/FRED data, then rebuild the page
        run: |
          python fetch_data.py
          python bundle.py

      - name: Save the refreshed data back to the repo
        run: |
          git config user.name  "MI3 Dashboard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Monthly full data refresh (auto)" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Package the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish-online

      - name: Publish to the live link
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Quarterly review reminder (only Jan / Apr / Jul / Oct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(date -u +%m)
          if [ "$m" = "01" ] || [ "$m" = "04" ] || [ "$m" = "07" ] || [ "$m" = "10" ]; then
            python review_checklist.py > _review.md
            gh issue create \
              --title "Quarterly review — check sourced figures & oil news" \
              --body-file _review.md
          else
            echo "Data refreshed. Not a quarter month, so no review issue this month."
          fi
