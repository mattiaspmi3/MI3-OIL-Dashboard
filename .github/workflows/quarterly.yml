name: Monthly data refresh + quarterly review reminder

on:
  schedule:
    - cron: "0 8 1 * *"   # 08:00 UTC on the 1st of EVERY month
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  full-refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Put the API keys where the scripts expect them (.env, not committed)
        run: |
          echo "EIA_API_KEY=${{ secrets.EIA_API_KEY }}" >> .env
          echo "FRED_API_KEY=${{ secrets.FRED_API_KEY }}" >> .env

      - name: Re-pull ALL EIA/BLS/FRED data, then rebuild the page
        run: |
          python fetch_data.py
          python validate_data.py
          python bundle.py

      - name: Save the refreshed data back to the repo
        run: |
          git config user.name  "MI3 Dashboard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Monthly full data refresh (auto)"
            git push
          fi

      - name: Package the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish-online

      - name: Publish to the live link
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Quarterly review reminder (only Jan / Apr / Jul / Oct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%m)
          if [ "$month" = "01" ] || [ "$month" = "04" ] || [ "$month" = "07" ] || [ "$month" = "10" ]; then
            year=$(date -u +%Y)
            quarter=$(( (10#$month - 1) / 3 + 1 ))
            title="Quarterly sourced-data review - ${year} Q${quarter}"
            python review_checklist.py > _review.md
            open_issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
            if [ -z "$open_issue" ]; then
              quarter_start_month=$(( (quarter - 1) * 3 + 1 ))
              quarter_start=$(printf '%s-%02d-01' "$year" "$quarter_start_month")
              legacy_issue=$(gh issue list --state open --search "\"Quarterly review\" in:title created:>=$quarter_start" --json number --jq '.[0].number // empty')
              if [ -n "$legacy_issue" ]; then
                gh issue edit "$legacy_issue" --title "$title" --body-file _review.md --add-assignee "$GITHUB_REPOSITORY_OWNER"
                echo "Updated and assigned existing review issue #$legacy_issue"
              else
                gh issue create --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" --body-file _review.md
              fi
            else
              gh issue edit "$open_issue" --body-file _review.md --add-assignee "$GITHUB_REPOSITORY_OWNER"
              echo "Updated and assigned existing review issue #$open_issue"
            fi
          else
            echo "Data refreshed. Not a quarter month, so no review issue this month."
          fi
